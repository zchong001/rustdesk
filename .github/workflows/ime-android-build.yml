# 路线3（v2）：官方 1.5.0 + RustDesk 输入法补丁（含“回车提交”）
#
# v2 新增：
#   1) 内嵌 IME 源码（不再从本仓库 master 下载，workflow 自包含）
#   2) 按键（回车/退格等）也优先走 IME 的输入连接 —— 密码框只接受 IME，不接受无障碍按键注入
#   3) 回车会先尝试 performEditorAction(Done)，失败再发 KEYCODE_ENTER
# 为什么基于 1.5.0：master 的安卓视频编码在这台 vivo Y50 上 configure 失败（OMX -38，画面全黑）
name: Build IME APK (1.5.0 + enter)

on:
  workflow_dispatch:

env:
  UPSTREAM_REF: "1.5.0"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  NDK_VERSION: "r28c"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout upstream 1.5.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-150b-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-apk-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Checkout upstream 1.5.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Apply IME patch
        shell: bash
        run: |
          set -euo pipefail
          KDIR="flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb"
          RES="flutter/android/app/src/main/res"
          mkdir -p "$KDIR" "$RES/xml"

          echo "==> 写入 RustDeskIme.kt"
          cat > "$KDIR/RustDeskIme.kt" <<'KOTLIN_EOF'
          package com.carriez.flutter_hbb

          import android.inputmethodservice.InputMethodService
          import android.util.Log
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.TextView

          /**
           * RustDesk 远程输入法（自定义补丁）
           * 远程文本/按键经本 IME 的 InputConnection 提交 —— 密码框只接受 IME，不接受无障碍注入。
           */
          class RustDeskIme : InputMethodService() {

              companion object {
                  private const val TAG = "RustDeskIme"

                  @Volatile
                  private var instance: RustDeskIme? = null

                  val isActive: Boolean
                      get() = instance != null

                  fun commitRemoteText(text: String): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val ok = conn.commitText(text, 1)
                          conn.finishComposingText()
                          Log.i(TAG, "commitText ok=" + ok)
                          ok
                      } catch (e: Exception) {
                          Log.e(TAG, "commitText failed", e)
                          false
                      }
                  }

                  fun sendRemoteKeyEvent(event: KeyEvent): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val sent = conn.sendKeyEvent(event)
                          if (event.action == KeyEvent.ACTION_DOWN) {
                              conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, event.keyCode))
                          }
                          sent
                      } catch (e: Exception) {
                          Log.e(TAG, "sendRemoteKeyEvent failed", e)
                          false
                      }
                  }

                  /** 回车提交：先试 performEditorAction(Done)，不行再发 KEYCODE_ENTER */
                  fun submitEnter(): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val opts = ime.currentInputEditorInfo?.imeOptions ?: 0
                          val action = opts and EditorInfo.IME_MASK_ACTION
                          if (action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED) {
                              val acted = conn.performEditorAction(action)
                              Log.i(TAG, "performEditorAction action=" + action + " ok=" + acted)
                              if (acted) return true
                          }
                          val ok = conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) &&
                                   conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                          Log.i(TAG, "sendKeyEvent ENTER ok=" + ok)
                          ok
                      } catch (e: Exception) {
                          Log.e(TAG, "submitEnter failed", e)
                          false
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  Log.i(TAG, "onCreate")
              }

              override fun onDestroy() {
                  instance = null
                  Log.i(TAG, "onDestroy")
                  super.onDestroy()
              }

              override fun onStartInput(editorInfo: EditorInfo?, restarting: Boolean) {
                  super.onStartInput(editorInfo, restarting)
                  Log.d(TAG, "onStartInput pkg=" + editorInfo?.packageName)
              }

              override fun onCreateInputView(): View {
                  val view = TextView(this)
                  view.text = "RustDesk 远程输入法（请在控制端输入）"
                  view.textSize = 13f
                  view.setPadding(24, 18, 24, 18)
                  return view
              }
          }
          KOTLIN_EOF

          echo "==> 写入 rustdesk_ime.xml"
          cat > "$RES/xml/rustdesk_ime.xml" <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:label="@string/rustdesk_ime_subtype"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          XML_EOF

          echo "==> 就地修改 AndroidManifest / strings.xml / InputService.kt"
          python3 - <<'PY'
          import io, sys

          def edit(path, old, new):
              t = io.open(path, encoding="utf-8").read()
              if old not in t:
                  print("ANCHOR NOT FOUND:", path)
                  sys.exit(1)
              io.open(path, "w", encoding="utf-8").write(t.replace(old, new, 1))
              print("patched", path)

          mf = "flutter/android/app/src/main/AndroidManifest.xml"
          old_mf = '''            <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>'''
          new_mf = old_mf + '''

                  <!-- RustDesk 远程输入法（自定义补丁） -->
                  <service
                      android:name=".RustDeskIme"
                      android:exported="true"
                      android:label="RustDesk"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/rustdesk_ime" />
                  </service>'''
          edit(mf, old_mf, new_mf)

          st = "flutter/android/app/src/main/res/values/strings.xml"
          edit(st, "</resources>",
               '    <string name="rustdesk_ime_subtype">RustDesk 远程输入</string>\n</resources>')

          ins = "flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/InputService.kt"
          old_ins = '''            } else if (tryHandlePowerKeyEvent(event)) {
                          return
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {'''
          new_ins = '''            } else if (tryHandlePowerKeyEvent(event)) {
                          return
                      }
                  }

                  // [RustDesk IME patch 1] 文本优先走 IME.commitText（密码框也接受）
                  if (textToCommit != null && RustDeskIme.commitRemoteText(textToCommit)) {
                      return
                  }

                  // [RustDesk IME patch 2] 按键（回车/退格等）也优先走 IME 的输入连接：
                  // 密码框会拒绝无障碍按键注入，但接受 IME。失败则回落到原有逻辑。
                  if (RustDeskIme.isActive && ke != null) {
                      if (ke.keyCode == KeyEventAndroid.KEYCODE_ENTER) {
                          if (RustDeskIme.submitEnter()) {
                              return
                          }
                      } else if (RustDeskIme.sendRemoteKeyEvent(ke)) {
                          return
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {'''
          edit(ins, old_ins, new_ins)

          print("IME patch applied OK")
          PY

          echo "==> 校验补丁结果"
          grep -c "RustDeskIme" flutter/android/app/src/main/AndroidManifest.xml
          grep -c "rustdesk_ime_subtype" flutter/android/app/src/main/res/values/strings.xml
          grep -c "submitEnter" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/InputService.kt
          grep -c "submitEnter" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/RustDeskIme.kt

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-150b
          key: aarch64-linux-android

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p out
          mv ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/rustdesk-${{ env.VERSION }}-arm64-ime-enter.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ime-150-enter-arm64-apk
          path: out/rustdesk-${{ env.VERSION }}-arm64-ime-enter.apk
