# 路线3（v3）：官方 1.5.0 + RustDesk 输入法补丁（含回车提交）+ 无帧看门狗
#
# v3 新增【无帧看门狗】：屏幕处于安全窗口（钉钉登录/密码页）或采集卡住导致长时间无帧时，
#   自动重新绑定虚拟显示表面（复用已有 MediaProjection，不弹权限框）→ 画面自动恢复，
#   无需再手动"回主页/断开重连"。
#   实现位置：MainService.kt（默认走 ImageReader 原始帧路径，每帧都会触发监听回调，
#   正好是观测"是否还有帧"的最佳位置；恢复复用现成的 createOrSetVirtualDisplay / resize+setSurface）。
#
# v2：内嵌 IME 源码；按键（回车/退格）也走 IME 输入连接；回车 = performEditorAction(Done)
# 为什么基于 1.5.0：master 的安卓视频编码在这台 vivo Y50 上 configure 失败（OMX -38，画面全黑）
name: Build IME APK (1.5.0 + enter + watchdog)

on:
  workflow_dispatch:

env:
  UPSTREAM_REF: "1.5.0"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  NDK_VERSION: "r28c"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout upstream 1.5.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-150c-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-apk-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Checkout upstream 1.5.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Apply patches (IME + enter + watchdog)
        shell: bash
        run: |
          set -euo pipefail
          KDIR="flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb"
          RES="flutter/android/app/src/main/res"
          mkdir -p "$KDIR" "$RES/xml"

          echo "==> 写入 RustDeskIme.kt"
          cat > "$KDIR/RustDeskIme.kt" <<'KOTLIN_EOF'
          package com.carriez.flutter_hbb

          import android.inputmethodservice.InputMethodService
          import android.util.Log
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.TextView

          /**
           * RustDesk 远程输入法（自定义补丁）
           * 远程文本/按键经本 IME 的 InputConnection 提交 —— 密码框只接受 IME，不接受无障碍注入。
           */
          class RustDeskIme : InputMethodService() {

              companion object {
                  private const val TAG = "RustDeskIme"

                  @Volatile
                  private var instance: RustDeskIme? = null

                  val isActive: Boolean
                      get() = instance != null

                  fun commitRemoteText(text: String): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val ok = conn.commitText(text, 1)
                          conn.finishComposingText()
                          Log.i(TAG, "commitText ok=" + ok)
                          ok
                      } catch (e: Exception) {
                          Log.e(TAG, "commitText failed", e)
                          false
                      }
                  }

                  fun sendRemoteKeyEvent(event: KeyEvent): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val sent = conn.sendKeyEvent(event)
                          if (event.action == KeyEvent.ACTION_DOWN) {
                              conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, event.keyCode))
                          }
                          sent
                      } catch (e: Exception) {
                          Log.e(TAG, "sendRemoteKeyEvent failed", e)
                          false
                      }
                  }

                  /** 回车提交：先试 performEditorAction(Done)，不行再发 KEYCODE_ENTER */
                  fun submitEnter(): Boolean {
                      val ime = instance ?: return false
                      val conn = ime.currentInputConnection ?: return false
                      return try {
                          val opts = ime.currentInputEditorInfo?.imeOptions ?: 0
                          val action = opts and EditorInfo.IME_MASK_ACTION
                          if (action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED) {
                              val acted = conn.performEditorAction(action)
                              Log.i(TAG, "performEditorAction action=" + action + " ok=" + acted)
                              if (acted) return true
                          }
                          val ok = conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) &&
                                   conn.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                          Log.i(TAG, "sendKeyEvent ENTER ok=" + ok)
                          ok
                      } catch (e: Exception) {
                          Log.e(TAG, "submitEnter failed", e)
                          false
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  Log.i(TAG, "onCreate")
              }

              override fun onDestroy() {
                  instance = null
                  Log.i(TAG, "onDestroy")
                  super.onDestroy()
              }

              override fun onStartInput(editorInfo: EditorInfo?, restarting: Boolean) {
                  super.onStartInput(editorInfo, restarting)
                  Log.d(TAG, "onStartInput pkg=" + editorInfo?.packageName)
              }

              override fun onCreateInputView(): View {
                  val view = TextView(this)
                  view.text = "RustDesk 远程输入法（请在控制端输入）"
                  view.textSize = 13f
                  view.setPadding(24, 18, 24, 18)
                  return view
              }
          }
          KOTLIN_EOF

          echo "==> 写入 rustdesk_ime.xml"
          cat > "$RES/xml/rustdesk_ime.xml" <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:label="@string/rustdesk_ime_subtype"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          XML_EOF

          echo "==> 就地修改 AndroidManifest / strings.xml / InputService.kt / MainService.kt"
          python3 - <<'PY'
          import io, sys

          def edit(path, old, new):
              t = io.open(path, encoding="utf-8").read()
              if old not in t:
                  print("ANCHOR NOT FOUND:", path)
                  print("---- anchor ----")
                  print(old)
                  sys.exit(1)
              io.open(path, "w", encoding="utf-8").write(t.replace(old, new, 1))
              print("patched", path)

          # 1) AndroidManifest.xml：注册 IME 服务
          mf = "flutter/android/app/src/main/AndroidManifest.xml"
          old_mf = '''            <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>'''
          new_mf = old_mf + '''

                  <!-- RustDesk 远程输入法（自定义补丁） -->
                  <service
                      android:name=".RustDeskIme"
                      android:exported="true"
                      android:label="RustDesk"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/rustdesk_ime" />
                  </service>'''
          edit(mf, old_mf, new_mf)

          # 2) strings.xml：输入法子类型名称
          st = "flutter/android/app/src/main/res/values/strings.xml"
          edit(st, "</resources>",
               '    <string name="rustdesk_ime_subtype">RustDesk 远程输入</string>\n</resources>')

          # 3) InputService.kt：文本与按键优先走 IME（回车提交）
          ins = "flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/InputService.kt"
          old_ins = '''            } else if (tryHandlePowerKeyEvent(event)) {
                          return
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {'''
          new_ins = '''            } else if (tryHandlePowerKeyEvent(event)) {
                          return
                      }
                  }

                  // [RustDesk IME patch 1] 文本优先走 IME.commitText（密码框也接受）
                  if (textToCommit != null && RustDeskIme.commitRemoteText(textToCommit)) {
                      return
                  }

                  // [RustDesk IME patch 2] 按键（回车/退格等）也优先走 IME 的输入连接
                  if (RustDeskIme.isActive && ke != null) {
                      if (ke.keyCode == KeyEventAndroid.KEYCODE_ENTER) {
                          if (RustDeskIme.submitEnter()) {
                              return
                          }
                      } else if (RustDeskIme.sendRemoteKeyEvent(ke)) {
                          return
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {'''
          edit(ins, old_ins, new_ins)

          # 4) MainService.kt：无帧看门狗（安全窗口/采集卡住时自动重建采集表面）
          ms = "flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt"
          wd_fields = '''    private var virtualDisplay: VirtualDisplay? = null

              // ===== [无帧看门狗 patch] =====
              // 安全窗口（钉钉登录/密码页）或采集卡住时 MediaProjection 停止出帧；
              // 检测到长时间无帧则重新绑定虚拟显示表面（复用现有 MediaProjection，不弹权限框）。
              private var wdLastFrameAt = 0L
              private var wdLastRecoveryAt = 0L
              private var wdRunning = false
              private val wdHandler = android.os.Handler(android.os.Looper.getMainLooper())
              private val WD_INTERVAL = 5000L
              private val WD_NO_FRAME = 10000L
              private val WD_COOLDOWN = 30000L

              private val wdTask = object : Runnable {
                  override fun run() {
                      try {
                          if (wdRunning && isStart && wdLastFrameAt > 0) {
                              val now = System.currentTimeMillis()
                              val pm = getSystemService("power") as? android.os.PowerManager
                              val interactive = pm?.isInteractive ?: true
                              if (interactive && now - wdLastFrameAt > WD_NO_FRAME &&
                                  now - wdLastRecoveryAt > WD_COOLDOWN) {
                                  wdLastRecoveryAt = now
                                  Log.w(logTag, "[watchdog] no frame for " + (now - wdLastFrameAt) +
                                          "ms, re-attach capture surface")
                                  reattachCaptureSurface()
                              }
                          }
                      } catch (e: Exception) {
                          Log.e(logTag, "[watchdog] error: " + e)
                      }
                      if (wdRunning) wdHandler.postDelayed(this, WD_INTERVAL)
                  }
              }

              private fun startWatchdog() {
                  if (wdRunning) return
                  wdRunning = true
                  wdLastFrameAt = System.currentTimeMillis()
                  wdLastRecoveryAt = 0L
                  wdHandler.postDelayed(wdTask, WD_INTERVAL)
                  Log.d(logTag, "[watchdog] started")
              }

              private fun stopWatchdog() {
                  wdRunning = false
                  wdHandler.removeCallbacks(wdTask)
                  Log.d(logTag, "[watchdog] stopped")
              }

              private fun reattachCaptureSurface() {
                  val s = surface ?: return
                  val vd = virtualDisplay
                  try {
                      if (vd != null) {
                          vd.setSurface(null)
                          wdHandler.postDelayed({
                              try {
                                  vd.resize(SCREEN_INFO.width, SCREEN_INFO.height, SCREEN_INFO.dpi)
                                  vd.setSurface(s)
                                  Log.w(logTag, "[watchdog] surface re-attached")
                              } catch (e: Exception) {
                                  Log.e(logTag, "[watchdog] re-attach failed: " + e)
                              }
                          }, 400)
                      } else {
                          val mp = mediaProjection
                          if (mp != null) createOrSetVirtualDisplay(mp, s)
                      }
                  } catch (e: Exception) {
                      Log.e(logTag, "[watchdog] restart failed: " + e)
                  }
              }
              // ===== [/无帧看门狗 patch] ====='''
          edit(ms, "    private var virtualDisplay: VirtualDisplay? = null", wd_fields)

          # 每帧刷新时间戳（ImageReader 每帧都会回调）
          edit(ms, "if (image == null || !isStart) return@setOnImageAvailableListener",
                  "if (image == null || !isStart) return@setOnImageAvailableListener\n                                wdLastFrameAt = System.currentTimeMillis()")

          # 采集启动时开启看门狗
          edit(ms, '        _isStart = true\n        FFI.setFrameRawEnable("video",true)',
                  '        _isStart = true\n        startWatchdog()\n        FFI.setFrameRawEnable("video",true)')

          # 采集停止时关闭看门狗
          edit(ms, '    fun stopCapture() {\n        Log.d(logTag, "Stop Capture")',
                  '    fun stopCapture() {\n        Log.d(logTag, "Stop Capture")\n        stopWatchdog()')

          print("ALL patches applied OK")
          PY

          echo "==> 校验补丁结果"
          grep -c "RustDeskIme" flutter/android/app/src/main/AndroidManifest.xml
          grep -c "rustdesk_ime_subtype" flutter/android/app/src/main/res/values/strings.xml
          grep -c "submitEnter" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/InputService.kt
          grep -c "submitEnter" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/RustDeskIme.kt
          grep -c "watchdog" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          grep -n "startWatchdog()" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          grep -n "wdLastFrameAt = System.currentTimeMillis()" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-150c
          key: aarch64-linux-android

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p out
          mv ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/rustdesk-${{ env.VERSION }}-arm64-ime-watchdog.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ime-watchdog-arm64-apk
          path: out/rustdesk-${{ env.VERSION }}-arm64-ime-watchdog.apk
